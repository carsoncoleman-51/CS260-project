<!DOCTYPE html>
<html lang="en">
    <head>
      <title>THE RED BUTTON GAME</title>
      <meta name="viewport" content="width=device-width,initial-scale=1" />
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
      <link rel="preconnect" href="https://fonts.googleapis.com">

    <body>
      <header> 
        <h1 id="game-title">THE <span class="red-word">RED</span> BUTTON GAME</h1>
        <nav>
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="play.html">Play</a></li>
            <li><a href="scores.html">Scores</a></li>
          </ul>
        </nav>
      </header>
      
      <main>
        <div class="Players">
            Player:
            <span class="player-name">*players name*</span>
        </div>
        <div class="personal-high-score">
            Personal High Score:
            <span class="personal-high-score">0</span>
        </div>
        <ul class="notification">
            <li class="player-name"> *player1* got a new High Score! </li>
            <li class="player-name"> *player2* got a new High Score! </li>
        </ul>
    
    <div class="scores-display">
        Current Win Streak: <span class="win-streak">0</span>
    </div>

    <div class="red-button" aria-label="Red button">
      <span class="red-button-top"></span>
    </div>
    

      </main>
